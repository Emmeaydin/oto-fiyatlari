name: Weekly official price check

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get app files
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scraper dependency
        run: python -m pip install -r requirements.txt
      - name: Check official price pages
        run: python scripts/update_official_prices.py
      - name: Keep check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-price-check-report
          path: price-update-report.json
          if-no-files-found: ignore
      - name: Save updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official vehicle prices"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site files
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5
